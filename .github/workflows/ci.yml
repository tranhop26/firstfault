name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-direct:
    name: Direct Mode Tests
    if: ${{ hashFiles('tests/direct/test_*.py') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/direct/ -v
